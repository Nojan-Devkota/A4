<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jon Daniel — Portfolio</title>
    <meta name="description" content="Jon Daniel's creative design portfolio showcasing 251 projects and 172 global design awards.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <main class="portfolio-grid" id="portfolio">

        <section class="profile-card" id="profile-card">
            <nav class="side-nav" id="side-nav">
                <a href="#" class="side-nav__link">Podcast</a>
                <a href="#" class="side-nav__link">Portfolio</a>
                <a href="#" class="side-nav__link active">Research</a>
                <a href="#" class="side-nav__link">Clients</a>
            </nav>

            <div class="about-label" id="about-label">
                <span class="about-label__icon">✦</span>
                <span>About Me</span>
            </div>

            <div class="photo-wrapper" id="photo-wrapper">
                <div class="photo-ring">
                    <div class="photo-bg-circle"></div>
                </div>
                <img src="assets/jon-photo.png" alt="Jon Daniel portrait" class="photo-img">
            </div>

            <div class="name-block" id="name-block">
                <h1 class="name-block__title">Im,<br>Jon<br>Daniel</h1>
            </div>

            <div class="profile-footer" id="profile-footer">
                <a href="mailto:inquiry@jondaniel.design" class="profile-footer__email">
                    inquiry@jondaniel.design
                </a>
                <span class="profile-footer__icon">✉</span>
            </div>

            <div class="badge" id="badge">
                <img src="assets/black_circle-removebg-preview.png" alt="2025 Design Portfolio badge" class="badge__img">
            </div>
        </section>

        <div class="heading-cell" id="heading-cell">
            <h2 class="heading-cell__title">Portfolio</h2>
            <span class="corner-mark"></span>
        </div>

        <div class="flamingo-card" id="flamingo-card">
            <span class="corner-mark"></span>
            <img src="assets/bird-wide.png" alt="Flamingo art piece" class="flamingo-card__img">
            <button class="play-btn" id="play-btn" aria-label="Play video">
                <svg width="18" height="20" viewBox="0 0 18 20" fill="none">
                    <path d="M17 10L1 19V1L17 10Z" fill="white" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>

        <div class="stats-stack" id="stats-stack">
            <div class="stat-card stat-card--mint" id="stat-projects">
                <span class="corner-mark"></span>
                <span class="stat-card__number">251</span>
                <span class="stat-card__label">Projects</span>
            </div>
            <div class="stat-card stat-card--purple" id="stat-awards">
                <span class="corner-mark"></span>
                <span class="stat-card__number">156</span>
                <span class="stat-card__label">Awards</span>
            </div>
        </div>

        <div class="clients-card" id="clients-card">
            <span class="corner-mark"></span>
            <svg class="clients-card__logo" viewBox="0 0 16 16" fill="white" width="42" height="50">
                <path d="M11.182.008C11.148-.03 9.923.023 8.857 1.18c-1.066 1.156-.902 2.482-.878 2.516s1.52.087 2.475-1.258.762-2.391.728-2.43m3.314 11.733c-.048-.096-2.325-1.234-2.113-3.422s1.675-2.789 1.698-2.854-.597-.79-1.254-1.157a3.7 3.7 0 0 0-1.563-.434c-.108-.003-.483-.095-1.254.116-.508.139-1.653.589-1.968.607-.316.018-1.256-.522-2.267-.665-.647-.125-1.333.131-1.824.328-.49.196-1.422.754-2.074 2.237-.652 1.482-.311 3.83-.067 4.56s.625 1.924 1.273 2.796c.576.984 1.34 1.667 1.659 1.899s1.219.386 1.843.067c.502-.308 1.408-.485 1.766-.472.357.013 1.061.154 1.782.539.571.197 1.111.115 1.652-.105.541-.221 1.324-1.059 2.238-2.758q.52-1.185.473-1.282"/>
            </svg>
            <span class="clients-card__text">Clients</span>
        </div>

        <div class="ball-card" id="ball-card">
            <span class="corner-mark"></span>
            <img src="assets/ball.png" alt="Abstract 3D sphere" class="ball-card__img">
        </div>

        <div class="awards-card" id="awards-card">
            <span class="corner-mark"></span>
            <span class="awards-card__number">172</span>
            <span class="awards-card__label">Global Design<br>Awards.</span>
        </div>

    </main>

</body>
</html>
